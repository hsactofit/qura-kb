# Qura backend stack. Runs identically on a Mac (Colima) or any Linux host.
#
# Variables come from $QURA_ROOT/compose.env (written by scripts/lib.sh):
#   QURA_ROOT, QURA_INFRA, COMPOSE_PROFILES, TAG_<SERVICE>
# Secrets live in $QURA_ROOT/env/<service>.env (chmod 600, never in git).
#
# Memory budget (Colima VM = 3 GB): postgres 768M, each API 512M, tunnel 128M,
# leaving ~1 GB headroom for image builds.

name: qura

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${QURA_ROOT}/env/postgres.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${QURA_INFRA}/postgres/init:/docker-entrypoint-initdb.d:ro
      - ${QURA_INFRA}/postgres/shared-db.sql:/qura/shared-db.sql:ro
    # Loopback only: reachable from the Mac for psql/backups, never from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 768m
    logging: *logging

  client-server:
    image: qura/client-server:${TAG_CLIENT_SERVER:-latest}
    build:
      context: ${QURA_ROOT}/repos/client-server
      dockerfile: ${QURA_INFRA}/docker/client-server.Dockerfile
    restart: unless-stopped
    env_file: ${QURA_ROOT}/env/client-server.env
    environment:
      QURA_CRM_INTERNAL_URL: http://crm-server:4000
    volumes:
      - client_storage:/data/storage
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/api/client/health/ready', timeout=4).status==200 else 1)"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    logging: *logging

  crm-server:
    image: qura/crm-server:${TAG_CRM_SERVER:-latest}
    build:
      context: ${QURA_ROOT}/repos/crm-server
      dockerfile: ${QURA_INFRA}/docker/crm-server.Dockerfile
    restart: unless-stopped
    env_file: ${QURA_ROOT}/env/crm-server.env
    environment:
      LOCAL_STORAGE_DIR: /data/storage
      CLIENT_STORAGE_DIR: /data/client-storage
    volumes:
      - crm_storage:/data/storage
      # Policy files clients upload in the portal; the CRM reads them in place (one copy).
      - client_storage:/data/client-storage:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    logging: *logging

  # Only started once the tunnel is configured (COMPOSE_PROFILES=tunnel).
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ${QURA_ROOT}/cloudflared:/etc/cloudflared:ro
    depends_on:
      - client-server
      - crm-server
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  client_storage:
  crm_storage:

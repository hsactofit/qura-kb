# Qura backend service registry — the single list the deployer reads.
#
# One service per line, pipe-separated:
#   name | github repo (owner/name) | branch | database name (or "-")
#
# - `name` must match the service name in compose/docker-compose.yml and the
#   Dockerfile at docker/<name>.Dockerfile.
# - The deployer polls each repo's branch and redeploys on every new commit.
# - `database` is dumped before each deploy (pre-deploy backup) and nightly.
#
# Adding a service: see kb/03-infra/runbooks/add-new-service.md

client-server|hsactofit/qura-client-server|main|qura_client
crm-server|hsactofit/Qura-crm-server|main|qura_crm
